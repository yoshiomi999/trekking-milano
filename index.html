<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trekking Milano</title>
<meta name="description" content="I trek del weekend organizzati dalla community TrekMI di Milano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pine-950:#131c15;
    --pine-900:#1b271d;
    --pine-800:#233026;
    --paper:#efe9db;
    --paper-dim:#d9d2c0;
    --cai-red:#c1272d;
    --cai-red-dim:#8f1f24;
    --ochre:#c08a34;
    --ink:#1d211a;
    --line: rgba(239,233,219,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 42px),
      var(--pine-950);
    color:var(--paper);
    font-family:'Source Sans 3', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- header ---------- */
  header.hero{
    padding:56px 20px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: linear-gradient(transparent, transparent);
    opacity:0.5;
  }
  .blaze{
    display:inline-flex;
    align-items:center;
    gap:2px;
    margin-bottom:22px;
  }
  .blaze span{
    display:block; width:26px; height:9px;
  }
  .blaze .r{background:var(--cai-red);}
  .blaze .w{background:var(--paper);}

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--ochre);
    margin:0 0 10px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:.03em;
    font-size:clamp(34px, 7vw, 52px);
    margin:0 0 14px;
    line-height:1.02;
  }
  .sub{
    color:var(--paper-dim);
    font-size:16px;
    max-width:46ch;
    margin:0 auto 24px;
    line-height:1.5;
  }
  .tg-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    background:var(--pine-800);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:2px;
  }
  .tg-badge b{color:var(--paper);}
  .tg-badge .dot{width:6px;height:6px;background:#4caf6a;border-radius:50%;display:inline-block;}

  /* ---------- week label ---------- */
  .week-label{
    display:flex;
    align-items:center;
    gap:14px;
    margin:44px 0 22px;
  }
  .week-label .line{flex:1;height:1px;background:var(--line);}
  .week-label span{
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-size:12px;
    color:var(--ochre);
    white-space:nowrap;
  }

  /* ---------- card ---------- */
  #treks{display:flex;flex-direction:column;gap:22px;}
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    padding:26px 26px 24px;
    position:relative;
    box-shadow:0 12px 30px -14px rgba(0,0,0,0.55);
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--cai-red);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:6px;
  }
  .day-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--cai-red-dim);
    font-weight:600;
  }
  .prov{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#6b6455;
  }
  h2{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:22px;
    line-height:1.15;
    margin:4px 0 4px;
    letter-spacing:.01em;
  }
  .peak{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--ochre);
    font-weight:600;
    margin-bottom:16px;
  }
  .organizer{
    font-size:14px;
    color:#4c473b;
    margin-bottom:18px;
  }
  .organizer b{color:var(--ink);}

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    border-top:1px solid rgba(29,33,26,0.12);
    border-bottom:1px solid rgba(29,33,26,0.12);
    padding:16px 0;
    margin-bottom:16px;
  }
  .stat .k{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#8a8371;
    margin-bottom:4px;
  }
  .stat .v{
    font-family:'JetBrains Mono', monospace;
    font-size:18px;
    font-weight:600;
  }

  .gauge{
    height:6px;
    background:rgba(29,33,26,0.1);
    border-radius:3px;
    margin-top:8px;
    overflow:hidden;
  }
  .gauge > i{
    display:block; height:100%;
    background:var(--cai-red);
  }

  .diff{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:3px 9px;
    border-radius:2px;
    color:#fff;
    margin-top:2px;
  }

  .meta-line{
    font-size:14px;
    color:#4c473b;
    margin-bottom:20px;
    line-height:1.5;
  }

  .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    text-decoration:none;
    padding:11px 18px;
    border-radius:2px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-primary{background:var(--cai-red); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid rgba(29,33,26,0.3);}
  .btn-disabled{
    background:transparent;
    color:#8a8371;
    border:1px dashed rgba(29,33,26,0.35);
    cursor:default;
  }

  footer{
    text-align:center;
    margin-top:60px;
    padding-top:26px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--paper-dim);
    line-height:1.8;
  }
  footer a{
    display:inline-block;
    margin-top:8px;
    color:var(--ochre);
    text-decoration:none;
    border-bottom:1px dashed var(--ochre);
  }

  @media (max-width:480px){
    .stats{grid-template-columns:1fr 1fr;}
    .stat:last-child{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="blaze" aria-hidden="true">
    <span class="w"></span><span class="r"></span><span class="w"></span>
  </div>
  <h1>Trekking Milano</h1>
  <p class="sub">Ogni fine settimana, un gruppo, una montagna. Le uscite organizzate dalla community, aggiornate qui.</p>
  <a class="tg-badge" href="https://t.me/TrekMI" target="_blank" rel="noopener">
    <span class="dot"></span> Community su Telegram · <b>6000+ iscritti</b>
  </a>
</header>

<div class="wrap">
  <div class="week-label"><span>Prossime uscite</span><div class="line"></div></div>
  <div id="treks"></div>

  <footer>
    TrekMI — community di trekking, Milano<br>
    Iscriviti al canale Telegram per tutte le uscite e le iscrizioni<br>
    <a href="archivio.html">Vedi i trek passati →</a>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   Aggiungi qui i trek della settimana. Ogni oggetto è un'uscita.
   maxDislivello serve solo per scalare la barretta "gauge": tienilo
   fisso (es. 1200) così le barre restano confrontabili di settimana
   in settimana, oppure aggiornalo se hai un'uscita molto più impegnativa.
------------------------------------------------------------------- */
const MAX_DISLIVELLO = 800;

const TREKS = [
  {
    giorno: "Dom 6 Sett",
    titolo: "Trek Nel Triangolo Lariano",
    monte: "Monte Palanzone da Colma di Sormano · 1434 m (CO)",
    organizzatore: "Laura",
    lunghezza: "8 km",
    dislivello: 310,
    difficolta: "Medio facile",
    pranzo: "Pranzo al sacco",
    provincia: "Prov. di Como",
    distanza: "62 km da Milano",
    iscrizione: "https://t.me/TrekMI/84341",
    youtube: "https://youtu.be/-01-uPjTSwY"
  },
  {
    giorno: "Dom 6 Sett",
    titolo: "Trek in Valmadrera",
    monte: "Monte Preguda da Valmadrera · 743 m (LC)",
    organizzatore: "Horacio",
    lunghezza: "10 km",
    dislivello: 640,
    difficolta: "Media",
    pranzo: "Pranzo al sacco",
    provincia: "Prov. di Lecco",
    distanza: "46 km da Milano",
    iscrizione: "https://t.me/TrekMI/84426",
    youtube: "https://youtu.be/qz-BMbRYlRk"
  },
];

const DIFF_COLORS = {
  "facile": "#4caf6a",
  "medio facile": "#7fae3f",
  "media": "#c08a34",
  "medio alta": "#c1272d",
  "alta": "#8f1f24"
};

function diffColor(diff){
  const key = diff.toLowerCase().trim();
  return DIFF_COLORS[key] || "#c08a34";
}

function renderTreks(){
  const container = document.getElementById('treks');
  container.innerHTML = TREKS.map(t => {
    const pct = Math.min(100, Math.round((t.dislivello / MAX_DISLIVELLO) * 100));
    const diffLabel = t.note ? `${t.difficolta} (${t.note})` : t.difficolta;
    return `
      <article class="card">
        <div class="card-top">
          <span class="day-tag">${t.giorno}</span>
          <span class="prov">${t.provincia} · ${t.distanza}</span>
        </div>
        <h2>${t.titolo}</h2>
        <p class="peak">${t.monte}</p>
        <p class="organizer">Organizzatore: <b>${t.organizzatore}</b></p>

        <div class="stats">
          <div class="stat">
            <div class="k">Lunghezza</div>
            <div class="v">${t.lunghezza}</div>
          </div>
          <div class="stat">
            <div class="k">Dislivello</div>
            <div class="v">${t.dislivello} m</div>
            <div class="gauge"><i style="width:${pct}%"></i></div>
          </div>
          <div class="stat">
            <div class="k">Difficoltà</div>
            <span class="diff" style="background:${diffColor(t.difficolta)}">${t.difficolta}</span>
          </div>
        </div>

        <p class="meta-line">${diffLabel}. ${t.pranzo}.</p>

        <div class="actions">
          ${t.iscrizione
            ? `<a class="btn btn-primary" href="${t.iscrizione}" target="_blank" rel="noopener">Iscriviti su Telegram</a>`
            : `<span class="btn btn-disabled">${t.iscrizioneTesto || 'Iscrizioni chiuse'}</span>`
          }
          ${t.youtube ? `<a class="btn btn-ghost" href="${t.youtube}" target="_blank" rel="noopener">Video del percorso</a>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

renderTreks();
</script>

</body>
</html>
