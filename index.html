<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trekking Milano</title>
<meta name="description" content="I trek del weekend organizzati dalla community TrekMI di Milano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="blaze" aria-hidden="true">
    <span class="g"></span><span class="w"></span><span class="r"></span>
  </div>
  <h1>Trekking Milano</h1>
  <p class="sub">Ogni fine settimana, un gruppo, una montagna. Le uscite organizzate dalla community, aggiornate qui.</p>
  <a class="tg-badge" href="https://t.me/TrekMI" target="_blank" rel="noopener">
    <span class="dot"></span> Community su Telegram · <b>6000+ iscritti</b>
  </a>
</header>

<div class="wrap">
  <div class="week-label"><span>Prossime uscite</span><div class="line"></div></div>
  <div id="treks"></div>

  <footer>
    TrekMI — community di trekking, Milano<br>
    Iscriviti al canale Telegram per tutte le uscite e le iscrizioni<br>
    <a href="archivio.html">Vedi i trek passati →</a>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   Aggiungi qui i trek della settimana. Ogni oggetto è un'uscita.
   maxDislivello serve solo per scalare la barretta "gauge": tienilo
   fisso (es. 1200) così le barre restano confrontabili di settimana
   in settimana, oppure aggiornalo se hai un'uscita molto più impegnativa.
------------------------------------------------------------------- */
const MAX_DISLIVELLO = 800;

const TREKS = [
  {
    giorno: "Dom 6 Sett",
    titolo: "Trek Nel Triangolo Lariano",
    monte: "Monte Palanzone da Colma di Sormano · 1434 m (CO)",
    organizzatore: "Laura",
    lunghezza: "8 km",
    dislivello: 310,
    difficolta: "Medio facile",
    pranzo: "Pranzo al sacco",
    provincia: "Prov. di Como",
    distanza: "62 km da Milano",
    iscrizione: "https://t.me/TrekMI/84341",
    youtube: "https://youtu.be/-01-uPjTSwY"
  },
  {
    giorno: "Dom 6 Sett",
    titolo: "Trek in Valmadrera",
    monte: "Monte Preguda da Valmadrera · 743 m (LC)",
    organizzatore: "Horacio",
    lunghezza: "10 km",
    dislivello: 640,
    difficolta: "Media",
    pranzo: "Pranzo al sacco",
    provincia: "Prov. di Lecco",
    distanza: "46 km da Milano",
    iscrizione: "https://t.me/TrekMI/84426",
    youtube: "https://youtu.be/qz-BMbRYlRk"
  },
];

const DIFF_COLORS = {
  "facile": "#4caf6a",
  "medio facile": "#7fae3f",
  "media": "#c08a34",
  "medio alta": "#c1272d",
  "alta": "#8f1f24"
};

function diffColor(diff){
  const key = diff.toLowerCase().trim();
  return DIFF_COLORS[key] || "#c08a34";
}

function renderTreks(){
  const container = document.getElementById('treks');
  container.innerHTML = TREKS.map(t => {
    const pct = Math.min(100, Math.round((t.dislivello / MAX_DISLIVELLO) * 100));
    const diffLabel = t.note ? `${t.difficolta} (${t.note})` : t.difficolta;
    return `
      <article class="card">
        <div class="card-top">
          <span class="day-tag">${t.giorno}</span>
          <span class="prov">${t.provincia} · ${t.distanza}</span>
        </div>
        <h2>${t.titolo}</h2>
        <p class="peak">${t.monte}</p>
        <p class="organizer">Organizzatore: <b>${t.organizzatore}</b></p>

        <div class="stats">
          <div class="stat">
            <div class="k">Lunghezza</div>
            <div class="v">${t.lunghezza}</div>
          </div>
          <div class="stat">
            <div class="k">Dislivello</div>
            <div class="v">${t.dislivello} m</div>
            <div class="gauge"><i style="width:${pct}%"></i></div>
          </div>
          <div class="stat">
            <div class="k">Difficoltà</div>
            <span class="diff" style="background:${diffColor(t.difficolta)}">${t.difficolta}</span>
          </div>
        </div>

        <p class="meta-line">${diffLabel}. ${t.pranzo}.</p>

        <div class="actions">
          ${t.iscrizione
            ? `<a class="btn btn-primary" href="${t.iscrizione}" target="_blank" rel="noopener">Iscriviti su Telegram</a>`
            : `<span class="btn btn-disabled">${t.iscrizioneTesto || 'Iscrizioni chiuse'}</span>`
          }
          ${t.youtube ? `<a class="btn btn-ghost" href="${t.youtube}" target="_blank" rel="noopener">Video del percorso</a>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

renderTreks();
</script>

</body>
</html>
